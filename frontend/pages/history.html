<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History | Skillora</title>
    <meta name="description" content="View your past resume analysis evaluations and track competency progress.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230F766E'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>

    <header class="app-header">
        <nav class="navbar">
            <a href="../index.html" class="brand-logo">
                <span class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </span>
                Skillora
                <span class="brand-badge">2.0</span>
            </a>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="analyze.html">Analyze Resume</a></li>
                <li><a href="history.html" class="active">History</a></li>
            </ul>

            <div class="nav-actions">
                <a href="analyze.html" class="btn btn-primary btn-sm">
                    New Analysis →
                </a>
            </div>
        </nav>
    </header>

    <main style="max-width: 900px; margin: 40px auto 80px; padding: 0 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
            <div>
                <span class="tag-pill tag-primary">LOCAL HISTORY</span>
                <h1 style="font-size: 28px; margin-top: 6px;">Recent Resume Evaluations</h1>
            </div>
            <button type="button" id="btn-clear-history" class="btn btn-outline btn-sm">
                Clear History
            </button>
        </div>

        <div id="history-list" style="display: flex; flex-direction: column; gap: 14px;">
            <!-- Rendered by JS -->
        </div>
    </main>

    <footer class="app-footer">
        <p class="footer-copy">
            © 2026 Skillora. Built to bridge technical skill gaps with explainable AI career intelligence.
        </p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const list = document.getElementById("history-list");
            const btnClear = document.getElementById("btn-clear-history");
            let history = [];

            try {
                history = JSON.parse(localStorage.getItem("skilloraHistory") || "[]");
            } catch {
                history = [];
            }

            function render() {
                if (!history.length) {
                    list.innerHTML = `
                        <div class="card" style="text-align: center; padding: 48px 24px; color: var(--text-muted);">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="margin-bottom: 12px; color: var(--text-subtle);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
                            <h3 style="margin-bottom: 6px;">No Recent Evaluations Found</h3>
                            <p style="font-size: 14px; margin-bottom: 20px;">Upload a resume and job description to start tracking your evaluations.</p>
                            <a href="analyze.html" class="btn btn-primary">Analyze Resume Now →</a>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = history.map(item => {
                    const dateStr = new Date(item.timestamp).toLocaleDateString(undefined, {
                        month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"
                    });
                    const score = Math.round(item.match_percentage || 0);

                    return `
                        <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 14px;">
                                <div style="width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;">
                                    ${score}%
                                </div>
                                <div>
                                    <div style="font-size: 16px; font-weight: 700; color: var(--text-main);">${item.filename || "Resume.pdf"}</div>
                                    <div style="font-size: 12px; color: var(--text-muted);">${dateStr} • ${item.matched_count || 0} matched, ${item.missing_count || 0} missing</div>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <a href="analyze.html" class="btn btn-outline btn-sm">Re-Analyze</a>
                                <a href="results.html" class="btn btn-secondary btn-sm">View Last Results</a>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            btnClear.addEventListener("click", () => {
                if (confirm("Are you sure you want to clear your local evaluation history?")) {
                    localStorage.removeItem("skilloraHistory");
                    history = [];
                    render();
                }
            });

            render();
        });
    </script>
</body>
</html>
